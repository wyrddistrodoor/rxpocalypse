<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RXpocalypse</title>
<style>
  :root{
    --bg:#0A0A0A;
    --card:#141412;
    --ink:#EDEAE0;
    --sub:#8C887C;
    --stamp:#5CD65C;
    --stamp-soft:#132A15;
    --ok:#8FBF5C;
    --ok-soft:#182212;
    --line:#2A2A26;
    --disp: 'Space Grotesk', 'Courier New', monospace;
    --body: 'Space Grotesk', 'Courier New', monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);
    min-height:100vh; padding:32px 16px; display:flex; justify-content:center;
    background-image: radial-gradient(circle at 1px 1px, #1a1a17 1px, transparent 0);
    background-size: 18px 18px;
  }
  .app{width:100%; max-width:420px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .brand{font-weight:700; font-size:18px; letter-spacing:-0.02em; text-transform:none;}
  .brand span{color:var(--stamp); font-style:italic;}
  .tag{font-size:10.5px; color:var(--sub); text-transform:lowercase; letter-spacing:0.02em;}

  .hero{border:1px dashed var(--line); border-radius:2px; padding:16px; margin-bottom:16px; position:relative;}
  .footer-box{
